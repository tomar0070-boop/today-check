
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 체크</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f3f7f4;font-family:sans-serif;color:#26352e}
main{max-width:480px;margin:auto}
h1{margin-bottom:5px}
.sub{color:#777}
.card,.task{background:white;border-radius:14px;padding:16px;margin:12px 0}
.bar{height:12px;background:#e5e5e5;border-radius:12px;overflow:hidden}
#progress{height:100%;width:0;background:#36a777}
form,.task{display:flex;gap:9px;align-items:center}
input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px}
.task span{flex:1;overflow-wrap:anywhere}
.done{text-decoration:line-through;color:#999}
button{padding:12px;border:0;border-radius:9px}
.add{background:#27885e;color:white}
.delete{background:#fff0f0;color:#b33}
</style>
</head>
<body>
<main>
<h1>오늘의 체크</h1>
<p class="sub">오늘도 하나씩 완료해 보세요.</p>
<section class="card">
<h3>오늘의 달성률</h3>
<div class="bar"><div id="progress"></div></div>
<p id="status">0개 중 0개 완료</p>
</section>
<form id="form">
<input id="input" type="text" placeholder="새로운 할 일 입력" aria-label="할 일">
<button class="add">추가</button>
</form>
<h3>할 일 목록</h3>
<div id="list"></div>
</main>
<script>
const key="today-check-tasks";
let tasks=[];
try{const data=JSON.parse(localStorage.getItem(key));tasks=Array.isArray(data)?data:[]}catch(e){}
function save(){localStorage.setItem(key,JSON.stringify(tasks))}
function render(){
const list=document.getElementById("list");
list.replaceChildren();
tasks.forEach(t=>{
const row=document.createElement("div");row.className="task";
const check=document.createElement("input");check.type="checkbox";check.checked=t.done;
check.setAttribute("aria-label",t.text+" 완료");
check.onchange=()=>{t.done=check.checked;save();render()};
const label=document.createElement("span");label.textContent=t.text;
if(t.done)label.className="done";
const del=document.createElement("button");del.className="delete";del.textContent="삭제";
del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};
row.append(check,label,del);list.append(row);
});
const done=tasks.filter(t=>t.done).length;
const percent=tasks.length?Math.round(done/tasks.length*100):0;
document.getElementById("progress").style.width=percent+"%";
document.getElementById("status").textContent=tasks.length+"개 중 "+done+"개 완료 ("+percent+"%)";
}
document.getElementById("form").onsubmit=e=>{
e.preventDefault();
const input=document.getElementById("input");
const value=input.value.trim();
if(!value)return;
tasks.push({id:crypto.randomUUID(),text:value,done:false});
input.value="";save();render();
};
render();
</script>
</body>
</html>
